
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>HUFS GSE · W9 | Vocabulary Quiz</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #202938;
      --muted: #687386;
      --line: #e1e6ef;
      --accent: #344f86;
      --accent-light: #edf2fc;
      --correct: #18794e;
      --correct-bg: #eaf7ef;
      --wrong: #b42318;
      --wrong-bg: #fff0ef;
      --pending: #8a5b08;
      --pending-bg: #fff6df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;
      line-height: 1.6;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(100% - 32px, 720px);
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .course-label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 8px 30px rgb(25 40 70 / 5%);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score {
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 4px;
      background: #e9edf5;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .question-area {
      padding: 30px 24px 26px;
    }

    .question-number {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .word {
      margin: 0;
      font-size: clamp(34px, 8vw, 48px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .instruction {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .option {
      display: flex;
      min-height: 62px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .option:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .option:focus-visible,
    .primary-button:focus-visible {
      outline: 3px solid #a9c2ff;
      outline-offset: 3px;
    }

    .option:disabled {
      cursor: default;
    }

    .option-letter {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .option-text {
      font-size: 15px;
      font-weight: 650;
    }

    .option.is-correct {
      border-color: #8ac9a5;
      background: var(--correct-bg);
      color: var(--correct);
    }

    .option.is-correct .option-letter {
      border-color: #8ac9a5;
      color: var(--correct);
    }

    .option.is-wrong {
      border-color: #f0aaa5;
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .option.is-wrong .option-letter {
      border-color: #f0aaa5;
      color: var(--wrong);
    }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 650;
    }

    .feedback.visible {
      display: block;
    }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct);
    }

    .feedback.wrong {
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .primary-button {
      min-height: 46px;
      padding: 11px 20px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    .primary-button:hover {
      background: #293f6d;
    }

    .primary-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #e9edf5;
      color: var(--text);
    }

    .secondary-button:hover {
      background: #dce3ef;
    }

    .summary {
      display: none;
      padding: 34px 24px;
      text-align: center;
    }

    .summary.visible {
      display: block;
    }

    .summary-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .final-score {
      margin: 0;
      color: var(--accent);
      font-size: 54px;
      font-weight: 850;
      letter-spacing: -0.05em;
      line-height: 1.2;
    }

    .summary-message {
      margin: 12px 0 24px;
      color: var(--muted);
    }

    .summary .actions {
      justify-content: center;
    }

    .storage-panel {
      margin-top: 20px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .storage-heading {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 800;
    }

    .storage-description {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .storage-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .storage-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid #edf0f5;
      font-size: 13px;
    }

    .storage-word {
      font-weight: 700;
    }

    .storage-status {
      flex-shrink: 0;
      color: var(--muted);
      text-align: right;
    }

    .storage-status.success {
      color: var(--correct);
    }

    .storage-status.failure {
      color: var(--wrong);
    }

    .storage-status.waiting {
      color: var(--pending);
    }

    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .footer p {
      margin: 4px 0;
    }

    @media (max-width: 480px) {
      .page {
        width: min(100% - 22px, 720px);
        padding-top: 24px;
      }

      .card-top {
        padding: 16px 18px;
      }

      .question-area {
        padding: 24px 18px 20px;
      }

      .options {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .option {
        min-height: 54px;
        padding: 12px 14px;
      }

      .storage-panel {
        padding: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <p class="course-label">HUFS GSE · W9</p>
      <h1>Vocabulary Quiz</h1>
      <p class="subtitle">GenAI + GitHub Pages + Supabase</p>
    </header>

    <section class="card" aria-label="영어 단어 퀴즈">
      <div class="card-top">
        <span class="eyebrow" id="stageLabel">Question 1 of 3</span>
        <span class="score" id="scoreLabel">Score 0 / 3</span>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question-area" id="questionArea">
        <p class="question-number" id="questionNumber">QUESTION 01</p>
        <h2 class="word" id="englishWord">abundant</h2>
        <p class="instruction">단어의 의미로 가장 알맞은 것을 선택하세요.</p>

        <div class="options" id="options" aria-label="답 선택지"></div>

        <div
          class="feedback"
          id="feedback"
          role="status"
          aria-live="polite"
        ></div>

        <div class="actions">
          <button class="primary-button" id="nextButton" hidden>
            다음 문제
          </button>
        </div>
      </div>

      <div class="summary" id="summary" aria-live="polite">
        <p class="summary-label">Quiz completed</p>
        <p class="final-score" id="finalScore">0 / 3</p>
        <p class="summary-message" id="summaryMessage"></p>
        <div class="actions">
          <button class="primary-button" id="retryButton">다시 풀기</button>
        </div>
      </div>
    </section>

    <section class="storage-panel" aria-label="응답 저장 상태">
      <h2 class="storage-heading">응답 저장 상태</h2>
      <p class="storage-description">
        각 문항을 처음 선택했을 때 저장을 한 번 시도합니다.
      </p>
      <ul class="storage-list" id="storageList"></ul>
    </section>

    <footer class="footer">
      <p>W9 · 학생 실습자료 · 2026-10-25</p>
      <p>HUFS GSE · English Vocabulary Practice</p>
    </footer>
  </main>

  <!-- Supabase JavaScript v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // Replace these two values with your Supabase project settings.
    const SUPABASE_URL = "https://gyoegypldzfousnpmrwg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_xbDVFhW1Ns-hS3kHFcSRbw_zZAosXTH";

    const QUESTIONS = [
      {
        question_no: 1,
        english_word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        correct_answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        correct_answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        correct_answer: "짧은"
      }
    ];

    const LETTERS = ["A", "B", "C", "D"];

    const state = {
      attemptId: null,
      questionIndex: 0,
      score: 0,
      questionStartedAt: 0,
      answered: false,
      answers: [],
      saveStatuses: [],
      client: null
    };

    const elements = {
      stageLabel: document.getElementById("stageLabel"),
      scoreLabel: document.getElementById("scoreLabel"),
      progressBar: document.getElementById("progressBar"),
      questionArea: document.getElementById("questionArea"),
      questionNumber: document.getElementById("questionNumber"),
      englishWord: document.getElementById("englishWord"),
      options: document.getElementById("options"),
      feedback: document.getElementById("feedback"),
      nextButton: document.getElementById("nextButton"),
      summary: document.getElementById("summary"),
      finalScore: document.getElementById("finalScore"),
      summaryMessage: document.getElementById("summaryMessage"),
      retryButton: document.getElementById("retryButton"),
      storageList: document.getElementById("storageList")
    };

    function isSupabaseConfigured() {
      return (
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_PUBLISHABLE_KEY !== "YOUR_PUBLISHABLE_KEY" &&
        SUPABASE_URL.startsWith("https://") &&
        SUPABASE_PUBLISHABLE_KEY.length > 0
      );
    }

    function initializeSupabase() {
      if (!isSupabaseConfigured()) {
        state.client = null;
        return;
      }

      if (!window.supabase || !window.supabase.createClient) {
        state.client = null;
        return;
      }

      try {
        state.client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );
      } catch (error) {
        console.error("Supabase initialization failed:", error);
        state.client = null;
      }
    }

    function updateScore() {
      elements.scoreLabel.textContent = `Score ${state.score} / 3`;
    }

    function renderStorageList() {
      elements.storageList.replaceChildren();

      QUESTIONS.forEach((question, index) => {
        const row = document.createElement("li");
        row.className = "storage-row";

        const word = document.createElement("span");
        word.className = "storage-word";
        word.textContent = `${question.question_no}. ${question.english_word}`;

        const status = document.createElement("span");
        status.className = "storage-status";
        status.id = `storage-status-${index}`;
        status.textContent = state.saveStatuses[index] || "응답 전";
        status.setAttribute("aria-live", "polite");

        row.append(word, status);
        elements.storageList.appendChild(row);
      });
    }

    function updateStorageStatus(index, message, statusType) {
      state.saveStatuses[index] = message;

      const statusElement = document.getElementById(
        `storage-status-${index}`
      );

      if (statusElement) {
        statusElement.textContent = message;
        statusElement.className = "storage-status";

        if (statusType) {
          statusElement.classList.add(statusType);
        }
      }
    }

    function renderQuestion() {
      const question = QUESTIONS[state.questionIndex];

      state.answered = false;
      state.questionStartedAt = performance.now();

      elements.questionArea.hidden = false;
      elements.summary.classList.remove("visible");

      elements.stageLabel.textContent =
        `Question ${state.questionIndex + 1} of ${QUESTIONS.length}`;

      elements.questionNumber.textContent =
        `QUESTION ${String(question.question_no).padStart(2, "0")}`;

      elements.englishWord.textContent = question.english_word;
      elements.progressBar.style.width =
        `${(state.questionIndex / QUESTIONS.length) * 100}%`;

      elements.feedback.textContent = "";
      elements.feedback.className = "feedback";
      elements.nextButton.hidden = true;

      elements.options.replaceChildren();

      question.options.forEach((optionText, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";

        const letter = document.createElement("span");
        letter.className = "option-letter";
        letter.textContent = LETTERS[optionIndex];

        const text = document.createElement("span");
        text.className = "option-text";
        text.textContent = optionText;

        button.append(letter, text);
        button.addEventListener("click", () => {
          handleAnswer(optionText, button);
        });

        elements.options.appendChild(button);
      });

      updateScore();
    }

    function handleAnswer(chosenAnswer, selectedButton) {
      // Guard against double-clicks and multiple responses to one question.
      if (state.answered) {
        return;
      }

      state.answered = true;

      const question = QUESTIONS[state.questionIndex];
      const responseTimeMs = Math.max(
        0,
        Math.round(performance.now() - state.questionStartedAt)
      );

      const isCorrect = chosenAnswer === question.correct_answer;

      if (isCorrect) {
        state.score += 1;
      }

      state.answers[state.questionIndex] = {
        question_no: question.question_no,
        english_word: question.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: responseTimeMs
      };

      updateScore();

      const buttons = elements.options.querySelectorAll("button");
      buttons.forEach((button) => {
        button.disabled = true;

        const optionText = button.querySelector(".option-text").textContent;

        if (optionText === question.correct_answer) {
          button.classList.add("is-correct");
        } else if (button === selectedButton && !isCorrect) {
          button.classList.add("is-wrong");
        }
      });

      elements.feedback.className =
        `feedback visible ${isCorrect ? "correct" : "wrong"}`;

      elements.feedback.textContent = isCorrect
        ? `정답입니다! ${question.english_word} = ${question.correct_answer}`
        : `오답입니다. 정답은 "${question.correct_answer}"입니다.`;

      updateStorageStatus(
        state.questionIndex,
        "저장 중…",
        "waiting"
      );

      // Saving is independent of quiz progression.
      // No SELECT, UPDATE, DELETE, or insert().select() is used.
      void saveAnswer({
        attempt_id: state.attemptId,
        question_no: question.question_no,
        english_word: question.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: responseTimeMs
      }, state.questionIndex);

      elements.nextButton.hidden = false;
      elements.nextButton.textContent =
        state.questionIndex === QUESTIONS.length - 1
          ? "결과 보기"
          : "다음 문제";
    }

    async function saveAnswer(answer, questionIndex) {
      if (!state.client) {
        updateStorageStatus(
          questionIndex,
          "저장 실패: URL/키 확인",
          "failure"
        );
        return;
      }

      try {
        const { error } = await state.client
          .from("quiz_answers")
          .insert({
            attempt_id: answer.attempt_id,
            question_no: answer.question_no,
            english_word: answer.english_word,
            chosen_answer: answer.chosen_answer,
            is_correct: answer.is_correct,
            response_time_ms: answer.response_time_ms
          });

        if (error) {
          console.error("Supabase INSERT failed:", error);
          updateStorageStatus(
            questionIndex,
            "저장 실패: 권한/설정 확인",
            "failure"
          );
          return;
        }

        updateStorageStatus(questionIndex, "저장 성공", "success");
      } catch (error) {
        console.error("Unexpected save error:", error);
        updateStorageStatus(questionIndex, "저장 실패: 연결 확인", "failure");
      }
    }

    function showSummary() {
      elements.questionArea.hidden = true;
      elements.summary.classList.add("visible");
      elements.progressBar.style.width = "100%";
      elements.stageLabel.textContent = "Quiz completed";

      elements.finalScore.textContent = `${state.score} / 3`;

      if (state.score === 3) {
        elements.summaryMessage.textContent = "완벽해요! 세 문제를 모두 맞혔습니다.";
      } else if (state.score === 2) {
        elements.summaryMessage.textContent = "잘했어요! 틀린 단어를 다시 확인해 보세요.";
      } else if (state.score === 1) {
        elements.summaryMessage.textContent = "좋은 시작이에요. 다시 풀며 복습해 보세요.";
      } else {
        elements.summaryMessage.textContent = "정답을 확인하고 한 번 더 도전해 보세요.";
      }

      updateScore();
    }

    function startQuiz() {
      if (!window.crypto || typeof window.crypto.randomUUID !== "function") {
        alert(
          "이 브라우저에서 crypto.randomUUID()를 사용할 수 없습니다. HTTPS 환경의 최신 브라우저에서 다시 열어 주세요."
        );
        return;
      }

      state.attemptId = window.crypto.randomUUID();
      state.questionIndex = 0;
      state.score = 0;
      state.questionStartedAt = 0;
      state.answered = false;
      state.answers = [];
      state.saveStatuses = QUESTIONS.map(() => "응답 전");

      initializeSupabase();
      renderStorageList();
      renderQuestion();
    }

    elements.nextButton.addEventListener("click", () => {
      if (!state.answered) {
        return;
      }

      if (state.questionIndex < QUESTIONS.length - 1) {
        state.questionIndex += 1;
        renderQuestion();
      } else {
        showSummary();
      }
    });

    elements.retryButton.addEventListener("click", startQuiz);

    // A new attempt ID is generated when the quiz first starts.
    startQuiz();
  </script>
</body>
</html>
